name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar repositorio
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 2. Escaneo de secretos con Gitleaks
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - name: Escaneo de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # 3. Análisis estático de código (SAST)
      - name: Análisis estático SAST (Semgrep)
        run: |
          python -m pip install semgrep
          semgrep scan --config auto

      # 4. Construcción de imagen Docker
      - name: Construir imagen Docker
        run: docker build -t minico-app:${{ github.sha }} .

      # 5. Escaneo de vulnerabilidades con Trivy
      - name: Escaneo de imagen (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: minico-app:${{ github.sha }}
          scan-type: image
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      # 6. Despliegue simulado
      - name: Despliegue simulado con secreto
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Desplegando con credencial almacenada como secreto (valor oculto)"
